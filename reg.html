<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotHouse - Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen">

    <div class="bg-slate-300 p-8 rounded-xl shadow-lg max-w-4xl w-full">
        <h1 class="text-center font-bold text-3xl text-black">Hello</h1>
        <p class="text-center font-medium text-black mb-6"> 
            Welcome to! <span class="text-blue-600 font-bold">SpotHouse</span>
        </p>

        <div class="flex flex-col md:flex-row items-center gap-8">
            <div class="bg-white p-4 rounded-lg hidden md:block">
                <img src="images/building3.jpg" alt="Building" class="w-64 h-auto rounded">
            </div>

            <section class="text-black p-8 bg-slate-100 text-center rounded-md flex-1 w-full">
                <h2 class="text-2xl font-bold mb-2">Sign Up</h2>
                <p class="text-sm text-gray-600 mb-6">Create your account for accessibility</p>
                
                <form id="registrationForm" class="flex flex-col gap-4">
                    <input type="text" id="firstName" placeholder="First name" class="p-2 border rounded" required>
                    <input type="text" id="lastName" placeholder="Last name" class="p-2 border rounded" required>
                    <input type="text" id="username" placeholder="Username" class="p-2 border rounded" required>
                    <input type="email" id="email" placeholder="Email" class="p-2 border rounded" required>
                    <input type="password" id="password" placeholder="Password" class="p-2 border rounded" required minlength="8">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" class="p-2 border rounded" required>
                    
                    <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded transition">
                        Register
                    </button>
                </form>

                <p class="mt-4 text-sm">
                    Already have an account? 
                    <a href="log.html" class="text-blue-500 font-bold hover:underline">Login</a>
                </p>
            </section>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
