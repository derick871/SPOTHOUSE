<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Portal | Available Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

    <nav class="bg-white border-b p-4 mb-8 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-600">SecureRent</h1>
            <span class="text-sm text-slate-500">Find Your Next Home</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-slate-800">Available Houses</h2>
            <p class="text-slate-500">Only showing units ready for immediate move-in.</p>
        </div>

        <div id="tenantGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-slate-400">Loading available houses...</p>
        </div>
    </main>

    <script src="ten.js"></script>
</body>
</html>
