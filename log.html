<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotHouse - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen">
    <div class="flex bg-slate-300 m-10 items-center rounded-xl shadow-lg max-w-4xl">
        <div class="bg-white rounded m-10 hidden md:block">
            <img src="images/building3.jpg" alt="images" class="w-64 h-auto m-10 rounded">
        </div>

        <section class="bg-white text-black m-10 p-8 rounded-lg shadow-sm flex-1">
            <h2 class="text-center text-2xl font-bold">Sign-In</h2>
            <p class="text-center text-gray-500 mb-6">Enter your details to sign-in to your account</p>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block mb-1 font-medium">Username or Email</label>
                    <input type="text" id="loginIdentifier" placeholder="Enter Your username/Email" 
                           class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-medium">Password</label>
                        <a href="#" class="text-sm text-blue-800 font-bold hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" id="loginPassword" placeholder="Enter Your password" 
                           class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                </div>

                <button type="submit" class="w-full mt-6 p-3 font-bold bg-blue-500 hover:bg-blue-600 rounded text-white transition">
                    Login
                </button>
            </form>
            
            <p class="text-center mt-4 text-sm text-gray-600">
                Don't have an account? <a href="index.html" class="text-blue-500 font-bold">Register</a>
            </p>
        </section>
    </div>

    <script src="auth.js"></script>
</body>
</html>
