<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="contact-container">
        <h2>Send us a Message</h2>
        <form action="#">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="4" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit">Submit Request</button>
        </form>
        <div class="mt-12 p-8 bg-slate-600 text-white rounded-xl text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h2 class="text-2xl font-bold text-amber-500 mb-2">Get in touch</h2>
                <p class="text-slate-400 mb-4">Have questions or want to list your properties? Reach out to us.</p>
                <div class="space-y-1">
                    <p><i class="fas fa-envelope mr-2 text-amber-500"></i> <a href="mailto:wanyamaderrick4@gmail.com" class="hover:underline">wanyamaderrick4@gmail.com</a></p>
                    <p><i class="fas fa-phone mr-2 text-amber-500"></i> <a href="tel:+254745668544">0745668544</a></p>
                    <p><i class="fas fa-map-marker-alt mr-2 text-amber-500"></i> Nairobi, Kenya</p>
                </div>
            </div>
            <button class="bg-slate-700 hover:bg-amber-500 text-white px-8 py-3 rounded-md font-bold transition-transform active:scale-95 shadow-lg">
                <a href="">Check-Out</a>
            </button>
        </div>
    </div>
    
</body>
</html>
