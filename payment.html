<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Selection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Google Sans', sans-serif; }
        .payment-form { display: none; }
        .payment-form.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
        <h2 class="text-2xl font-medium text-gray-800 mb-6">Payment method</h2>
        
        <!-- Payment Options Selector -->
        <div class="grid grid-cols-3 gap-2 mb-8 bg-gray-100 p-1 rounded-xl">
            <button onclick="showPayment('mpesa')" id="btn-mpesa" class="method-btn py-2 text-sm font-medium rounded-lg bg-white shadow-sm text-blue-600 transition-all">
                M-Pesa
            </button>
            <button onclick="showPayment('card')" id="btn-card" class="method-btn py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 transition-all">
                Card
            </button>
            <button onclick="showPayment('bank')" id="btn-bank" class="method-btn py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 transition-all">
                Bank
            </button>
        </div>

        <!-- Forms Container -->
        <div class="space-y-4">
            
            <!-- M-Pesa Form -->
            <div id="mpesa" class="payment-form active animate-in fade-in slide-in-from-bottom-2 duration-300">
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="tel" placeholder="07XX XXX XXX" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                <p class="mt-2 text-xs text-gray-500 italic">Enter your M-Pesa number to receive the payment prompt.</p>
            </div>

            <!-- Card Form -->
            <div id="card" class="payment-form animate-in fade-in slide-in-from-bottom-2 duration-300">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
                        <input type="text" placeholder="0000 0000 0000 0000" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Expiry</label>
                            <input type="text" placeholder="MM/YY" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">CVC</label>
                            <input type="text" placeholder="123" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bank Form -->
            <div id="bank" class="payment-form animate-in fade-in slide-in-from-bottom-2 duration-300">
                <label class="block text-sm font-medium text-gray-700 mb-1">Select Bank</label>
                <select class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white mb-4">
                    <option>KCB Bank</option>
                    <option>Equity Bank</option>
                    <option>Standard Chartered</option>
                </select>
                <label class="block text-sm font-medium text-gray-700 mb-1">Account Number</label>
                <input type="text" placeholder="Account Number" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

        </div>

        <button class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors shadow-md shadow-blue-200">
            Pay Now
        </button>
        
        <p class="text-center mt-6 text-xs text-gray-400 uppercase tracking-widest">Secure Checkout</p>
    </div>

    <script src="payment.js">
        
    </script>

</body>
</html>
